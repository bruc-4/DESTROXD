/* VIDEO */

blur(6px)
saturate(120%);

-webkit-backdrop-filter:
blur(6px)
saturate(120%);

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 8px 20px rgba(0,0,0,.25);

animation:float 6s ease infinite;

overflow:hidden;
}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-6px);
}

transform:translateY(0px);

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
position:relative;
}

/* VIDEO BG */

#bg-video{
position:fixed;
top:0;
left:0;

width:100%;
height:100%;

object-fit:cover;

filter:
blur(3px)
brightness(.75);

transform:scale(1.05);

z-index:-2;

pointer-events:none;
}

/* overlay */

body::before{
content:"";
position:fixed;
inset:0;

background:
linear-gradient(
to bottom,
rgba(0,0,0,.1),
rgba(0,0,0,.35)
);

z-index:-1;
}

/* card */

.container{

width:100%;
max-width:480px;

padding:30px;

border-radius:28px;

text-align:center;

background:rgba(255,255,255,.06);

backdrop-filter:
blur(14px)
saturate(160%);

border:1px solid rgba(255,255,255,.18);

box-shadow:
0 10px 35px rgba(0,0,0,.4);

overflow:hidden;

animation:float 6s ease-in-out infinite;
}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-6px);
}

100%{
transform:translateY(0px);
}

}

/* profile */

.profile-img{

width:130px;
height:130px;

border-radius:50%;

object-fit:cover;

border:2px solid rgba(255,255,255,.4);

box-shadow:
0 0 20px rgba(255,255,255,.3);

margin-bottom:18px;

user-select:none;
-webkit-user-drag:none;

}

h1{

color:white;
font-size:28px;
margin-bottom:22px;

}

/* buttons */

.social{

display:flex;
align-items:center;

gap:14px;

padding:14px;

margin:12px 0;

text-decoration:none;
color:white;
font-weight:600;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.15);

border-radius:14px;

transition:.3s;
}

.social:hover{

transform:scale(1.04);

background:rgba(255,255,255,.12);

}

.social img{

width:36px;
height:36px;

padding:6px;

border-radius:10px;

background:rgba(255,255,255,.1);

pointer-events:none;
}

/* upi */

.upi{

margin-top:20px;

padding:15px;

border-radius:14px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.15);

color:white;

}

/* sound */

#sound-btn{

position:fixed;

bottom:20px;
right:20px;

padding:10px 16px;

border:none;
border-radius:30px;

background:rgba(255,255,255,.1);

color:white;

backdrop-filter:blur(10px);

cursor:pointer;

z-index:999;
}
